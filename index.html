<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Countries App</title>
        <link href="./output.css" rel="stylesheet">
    </head>
    <body class="min-h-screen bg-[#fafafa] text-[#111517] dark:bg-[#202c37] dark:text-white">
        <header class="flex items-center justify-between bg-white px-6 py-4 shadow-sm dark:bg-[#2b3945]">
            <h1 class="text-lg font-extrabold text-black dark:text-white">Where in the World?</h1>
            <button id="theme-switcher-button" class="flex items-center gap-2 rounded-sm border border-transparent px-3 py-2 transition-colors hover:border-[#111517] dark:hover:border-white" type="button" aria-pressed="false">
                <i data-lucide="moon" aria-hidden="true"></i>
                <span id="theme-switcher-label">Dark Mode</span>
            </button>
        </header>
        <main class="mx-auto max-w-[1280px] px-6 py-9">
            <div class="flex items-center justify-between mb-10">
                <label for="country" class="sr-only">Search for a country</label>
                <div class="flex items-center gap-2 rounded-sm bg-white px-4 py-3 shadow-sm dark:bg-[#2b3945]">
                    <i data-lucide="search" aria-hidden="true"></i>
                    <input
                        class="min-w-0 bg-transparent text-sm outline-none placeholder:text-[#858585] dark:placeholder:text-white/70"
                        type="search"
                        id="country"
                        name="country"
                        placeholder="Search for a country...">
                </div>

                    <label for="region" class="sr-only">Filter by region</label>
                    <select class="rounded-sm bg-white px-4 py-3 text-sm shadow-sm dark:bg-[#2b3945] dark:text-white" id="region" name="region">
                        <option value="">Filter by Region</option>
                        <option value="Africa">Africa</option>
                        <option value="Americas">Americas</option>
                        <option value="Asia">Asia</option>
                        <option value="Europe">Europe</option>
                        <option value="Oceania">Oceania</option>
                    </select>
            </div>
            <div class="grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-4" id="country-results">

            </div>
        </main>
        
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>
        lucide.createIcons();
        </script>
        <script src="./script.js"></script>
    </body>
</html>
